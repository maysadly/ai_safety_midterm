<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login - Pixelkiln</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="stylesheet" href="/static/css/lab.css">
  <script src="/static/js/login.js" defer></script>
</head>
<body class="lab">
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark" aria-hidden="true"></span>Pixelkiln</a>
      <span class="lab-tag">Staff area</span>
    </div>
  </header>
  <main>
    <div class="wrap login-box">
      <h1>Staff login</h1>
      <p>The admin panel and the attack lab need the admin password from <code>.env</code>.</p>
      <form id="login-form">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">Log in</button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span class="fictional">Fictional company — student demo project (QAIRU, AISRA1301)</span>
      <span>Pixelkiln is not a real service. No real payments or accounts.</span>
    </div>
  </footer>
</body>
</html>
